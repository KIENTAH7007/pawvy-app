<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawvy — Order Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --cream: #f5f2eb;
        --orange: #f36f4a;
        --navy: #14213d;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--navy); color: var(--cream); font-family: 'Montserrat', sans-serif; }
      input::placeholder { color: rgba(20,33,61,.4); }
      input:focus { outline: 2px solid var(--orange); outline-offset: 1px; }
      button:focus-visible { outline: 2px solid var(--orange); outline-offset: 1px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .spin { animation: spin 1s linear infinite; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
